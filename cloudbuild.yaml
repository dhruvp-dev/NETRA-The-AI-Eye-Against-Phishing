# ==============================================================================
# Google Cloud Build Pipeline for NETRA FastAPI Cloud Run Deployment
# ==============================================================================
steps:
  # Step 1: Build Docker container on Google Cloud Build
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/netra-api:latest'
      - '-t'
      - 'gcr.io/$PROJECT_ID/netra-api:$SHORT_SHA'
      - '.'

  # Step 2: Push container to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/netra-api:latest'

  # Step 3: Deploy to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-cloud-run'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'netra-api'
      - '--image'
      - 'gcr.io/$PROJECT_ID/netra-api:latest'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--cpu'
      - '2'
      - '--memory'
      - '2Gi'
      - '--port'
      - '8080'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '5'
      - '--allow-unauthenticated'

images:
  - 'gcr.io/$PROJECT_ID/netra-api:latest'
  - 'gcr.io/$PROJECT_ID/netra-api:$SHORT_SHA'

options:
  machineType: 'E2_HIGHCPU_8'
